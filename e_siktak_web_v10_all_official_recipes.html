function curr(){return menus.find(m=>m.id===S.menu)}function won(n){return n.toLocaleString('ko-KR')+'원'}function selected(){return curr().items.filter(i=>S.checked[S.menu][i.id])}function sum(){return selected().reduce((a,i)=>a+i.price,0)}function scanned(){return curr().items.filter(i=>S.scanned[i.id])}function scannedSum(){return scanned().reduce((a,i)=>a+i.price*S.scanned[i.id],0)}function qualification(){return scanned().some(i=>i.kind==='core')&&scanned().filter(i=>i.kind==='sub').length>=2}function navto(p){S.page=p;window.scrollTo({top:0,behavior:'instant'});render()}function choose(id,p='menu'){S.menu=id;S.scanned={};S.servings=menus.find(m=>m.id===id).servings;navto(p)}function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}function ext(){window.open(RECIPE,'_blank','noopener,noreferrer');toast('공식 레시피북을 새 탭에서 열었어요')}function openRecipe(recipePage,back='home'){const officialRecipeUrls={oyster:'https://emart.kr/1030gulDmy',cutlet:'https://eapp.emart.com/webapp/recipe/352?trcknCode=main_banner',egg:'https://emart.kr/0925egTang'};const url=officialRecipeUrls[recipePage];if(url){window.open(url,'_blank','noopener,noreferrer');return}ext()}function head(title,back){return `<header class="header"><button class="iconbtn" aria-label="뒤로가기" onclick="navto('${back||'home'}')">‹</button><span class="header-title">${title}</span><div class="top-actions"><button class="iconbtn" aria-label="홈" onclick="navto('home')">⌂</button><button class="iconbtn" aria-label="메뉴" onclick="toast('e식탁 시연 서비스입니다')">☰</button></div></header>`}function nav(){return `<nav class="bottomnav">${[['home','홈','⌂'],['recipe','레시피북','▤'],['menus','e식탁','▣'],['coupons','쿠폰','▢'],['my','마이','♙']].map(([a,t,i])=>`<button class="navitem ${((a==='menus'&&['menus','menu','list','sco','receipt','recipe_oyster','recipe_cutlet','recipe_egg'].includes(S.page))||a===S.page)? function menuHome(){return `${head('e식탁','home')}<main class="page"><section class="hero"><div class="eyebrow">오늘의 저녁 메뉴 · e식탁</div><h1>오늘 저녁,<br>뭐 먹지?</h1><p>메뉴 고민은 줄이고, 장보기는 자유롭게.<br>이마트 레시피북에서 오늘의 요리를 골라보세요.</p></section><section class="section"><h2 class="section-title">오늘은 이 3가지 메뉴를 추천해요</h2><p class="desc">공식 레시피북 등록 메뉴 · 실제 행사/재고 추천은 시연용</p>${menus.map((m,i)=>card(m,i===0)).join('')}<div class="nudge"><b>이 메뉴들은 어떻게 선정됐나요?</b><br>향후 점포별 판매·재고·행사·계절성을 반영하는 큐레이션 기능을 제안합니다. 현재는 데모 메뉴 3개를 보여줍니다.</div></section><div class="smallfooter">각 메뉴의 공식 레시피 버튼은 첨부된 화면을 참고한 시연용 상세 페이지로 연결됩니다.</div></main>`}
function menuDetail(){const m=curr(),s=selected(),core=s.filter(i=>i.kind==='core').length,sub=s.filter(i=>i.kind==='sub').length;return `${head('오늘의 장보기','menus')}<main class="page"><section class="inner"><div class="step">e식탁 / 메뉴 선택 / 재료 확인</div><h1 style="font-size:26px;margin:5px 0 6px">${m.name}</h1><p class="desc">집에 있는 재료는 빼고, 필요한 것만 골라보세요.</p><div class="recipe-note">${m.time}분 · ${m.servings}인분 (공식 레시피북 표기)<br>아래 재료·가격·할인 대상은 <b>프로토타입 예시</b>입니다.</div><button class="btn block ghost" style="margin-top:13px" onclick="${m.recipePage?`openRecipe('${m.recipePage}','menu')`:'ext()'}">이마트 공식 레시피북에서 조리법 보기 ↗</button><div class="subhead">장보기 목록 <span style="font-size:12px;font-weight:500;color:#888">${s.length}개 선택</span></div>${m.items.map(i=>`<label class="listrow"><input type="checkbox" class="check" ${S.checked[m.id][i.id]?'checked':''} onchange="S.checked['${m.id}']['${i.id}']=this.checked;render()"><div class="rowgrow"><div class="rowtitle">${i.name} <span class="tag">${i.kind==='core'?'핵심 재료':i.kind==='sub'?'할인 보조':'선택 재료'}</span></div><div class="rowhint">${i.qty} · ${i.zone} 코너</div></div><div class="price">${won(i.price)}</div></label>`).join('')}<div class="receiptbox"><div class="sumrow"><span>선택 상품</span><b>${s.length}개</b></div><div class="sumrow"><span>예상 상품 금액</span><b>${won(sum())}</b></div></div><div class="notice" style="margin-top:15px"><b>메뉴 완성 할인 조건</b><br>핵심 재료 1종 + 서로 다른 지정 보조 재료 2종<br><div class="progress"><span style="width:${Math.min(100,((core>0?1:0)+Math.min(2,sub))/3*100)}%"></span></div>현재 선택: 핵심 ${core?1:0}/1 · 보조 ${Math.min(2,sub)}/2<br><small>실제 할인은 SCO 스캔 상품으로 다시 판정됩니다.</small></div></section></main><div class="stickyCTA"><button class="btn block" onclick="${s.length?'navto(\'sco\')':'toast(\'구매할 재료를 선택해주세요\')'}">계산대 할인 체험하기 →</button></div>`}
function sco(){let m=curr(),items=scanned(),ok=qualification(),subtotal=scannedSum(),discount=ok?1000:0;return `${head('SCO 계산 체험','menu')}<main class="page"><section class="inner"><div class="screen-tag">매장 셀프계산대 시뮬레이션 · 실제 결제 아님</div><h1 style="font-size:23px;margin:15px 0 2px">emart SCO</h1><p class="desc">선택한 상품을 하나씩 스캔해 할인 조건을 확인하세요.</p><div class="subhead">상품 스캔하기</div>${selected().map(i=>`<button class="scan-btn" onclick="scan('${i.id}')"><span><b>${i.name}</b><br><small style="color:#888">${won(i.price)} · ${i.kind==='core'?'핵심':i.kind==='sub'?'보조':'일반'}</small></span><span style="font-weight:900">${S.scanned[i.id]?`스캔 ${S.scanned[i.id]}개 · `:''}＋</span></button>`).join('')}${!selected().length?'<div class="nudge">선택된 상품이 없습니다. 장보기 화면으로 돌아가주세요.</div>':''}<div class="subhead">스캔된 상품</div>${items.length?items.map(i=>`<div class="listrow"><span class="rowgrow"><b>${i.name}</b> <span class="muted">×${S.scanned[i.id]}</span></span><b>${won(i.price*S.scanned[i.id])}</b><button class="iconbtn" style="font-size:18px" aria-label="상품 제거" onclick="unscan('${i.id}')">−</button></div>`).join(''):'<div class="nudge">아직 스캔된 상품이 없어요.</div>'}<div class="receiptbox"><div class="sumrow"><span>상품 합계</span><strong>${won(subtotal)}</strong></div><div class="sumrow"><span>e식탁 메뉴 완성 할인</span><strong style="color:${ok?'#d74a27':'#777'}">−${won(discount)}</strong></div><div class="sumrow big"><span>총 결제 금액</span><strong>${won(Math.max(0,subtotal-discount))}</strong></div><p class="desc">${ok?'✓ 할인 조건을 충족했습니다.':'핵심 재료 1종과 서로 다른 지정 보조 재료 2종을 스캔해주세요.'}</p></div></section></main><div class="stickyCTA"><button class="btn block" onclick="finish()" ${!items.length?'disabled':''}>결제 완료 체험 →</button></div>${S.modal?`<div class="modal-back"><div class="modal"><div style="font-size:32px">✓</div><h2>오늘의 저녁 완성!</h2><p>${m.name} 메뉴 재료를 담으셨네요.</p><div class="bigdiscount">1,000원 자동 할인</div><p>지정 상품 조합 할인 시뮬레이션</p><button class="btn block" onclick="S.modal=false;render()">확인</button></div></div>`:''}`}
function scan(id){const before=qualification();S.scanned[id]=(S.scanned[id]||0)+1;if(!before&&qualification())S.modal=true;render()}function unscan(id){if(S.scanned[id]>1)S.scanned[id]--;else delete S.scanned[id];S.modal=false;render()}function finish(){if(!scanned().length)return toast('상품을 스캔해주세요');S.paid=true;navto('receipt')}
function receipt(){const m=curr(),items=scanned(),total=scannedSum(),off=qualification()?1000:0,common=items.filter(i=>['양파','대파','계란','김치','당면'].includes(i.name)).map(i=>i.name),next=m.id==='oyster'?'굴전':m.id==='cutlet'?'김치볶음밥':'계란볶음밥';return `${head('오늘의 장보기 완료','sco')}<main class="page"><section class="inner"><div style="text-align:center;padding:20px 0 6px"><div style="background:#fff7d4;border-radius:100%;width:60px;height:60px;display:grid;place-items:center;font-size:28px;margin:auto">✓</div><h1 style="font-size:25px">오늘의 장보기 완료!</h1><p class="desc">${m.name} 메뉴를 위한 장보기를 마쳤어요.</p></div><div class="receiptpaper"><h3>emart <span style="font-size:13px;color:#aaa">e식탁</span></h3><div class="sub">시뮬레이션 영수증 · 실제 결제 아님</div>${items.map(i=>`<div class="sumrow"><span>${i.name} ×${S.scanned[i.id]}</span><span>${won(i.price*S.scanned[i.id])}</span></div>`).join('')}<hr style="border:0;border-top:1px dashed #ddd;margin:17px 0"><div class="sumrow"><span>상품 합계</span><b>${won(total)}</b></div><div class="sumrow"><span>e식탁 자동 할인</span><b style="color:#d64b24">−${won(off)}</b></div><div class="sumrow big"><span>최종 금액</span><strong>${won(Math.max(0,total-off))}</strong></div></div><h2 class="section-title" style="font-size:20px">오늘 산 재료로,<br>다음엔 뭘 만들까요?</h2><p class="desc">${common.length?`구매한 ${common.join('·')} 등을 활용해 보세요.`:'다음 식사를 위한 새로운 메뉴를 추천해요.'}</p><div class="menu-card" style="margin-top:13px"><div class="menu-data"><span class="pill">다음 식사 제안</span><h3>${next}</h3><p class="meta">${common.length?'중복 활용 가능 재료: '+common.join(', '):'추가 식재료가 필요할 수 있어요.'}<br>실제 조리법은 이마트 공식 레시피북에서 찾아보세요.</p><button class="btn block ghost" onclick="ext()">공식 레시피북 열기 ↗</button></div></div><div class="voucher"><div class="eyebrow">NEXT VISIT · 시연용 혜택</div><h3 style="font-size:19px;margin:10px 0 2px">다음 식탁을 위한 혜택</h3><strong>1,000원</strong><div class="desc">다음 메뉴 완성 구매 시 · 가상 차회 쿠폰</div><button class="btn block" style="margin-top:17px" onclick="S.saved=!S.saved;render()">${S.saved?'저장 완료 ✓':'혜택 저장하기'}</button></div><p class="desc" style="text-align:center;margin:20px 0">오늘의 장보기에서, 내일의 식탁까지</p><button class="btn block secondary" onclick="S.scanned={};navto('menus')">오늘의 메뉴 다시 보기</button></section></main>`}
function recipeOyster(){return `${head('레시피북',S.recipeBack||'home')}<main class="page"><div class="cover" style="height:340px"><img src="${curr().photo}" alt="굴당면 레시피 이미지" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback">굴 당면</div></div><section class="inner" style="padding-top:26px"><h1 style="font-size:31px;letter-spacing:-1.1px;line-height:1.28;margin:0 0 16px;font-weight:900">얼큰 뜨끈 든든한 굴 당면</h1><p style="color:#555;font-size:16px;line-height:1.8;margin:0 0 26px">쌀쌀한 날씨와 잘 어울리는 메뉴로 제철 굴과 당면, 매콤한 국물이 어우러진 굴 당면 어떠세요? 굴 특유의 시원한 감칠맛이 국물에 녹아들어 얼큰하면서도 깊은 맛을 냅니다. 탱글탱글한 굴과 쫄깃한 당면이 듬뿍 들어가 든든하고 따뜻하게 즐기기 좋은 한 그릇 메뉴예요.</p><div class="receiptbox" style="padding:0;overflow:hidden"><div style="display:grid;grid-template-columns:1fr 1fr"><div style="padding:18px 14px;text-align:center;border-right:1px solid #eee"><div class="muted" style="font-size:12px">소요시간</div><div style="font-weight:900;font-size:26px;margin-top:8px">20분</div></div><div style="padding:18px 14px;text-align:center"><div class="muted" style="font-size:12px">분량</div><div style="font-weight:900;font-size:26px;margin-top:8px">1인분</div></div></div></div><div class="subhead">재료</div><div class="receiptbox">${[['굴','150g (15알)'],['배추','50g (2장)'],['양파','50g (1/2개)'],['대파','20g (1토막)'],['청양고추','1개'],['당면(불리기 전)','50g'],['고춧가루, 올리브오일','각 1큰술'],['순후추, 자일로슈가, 소금','각 1작은술'],['물(국물용)','250ml']].map(([a,b])=>`<div class="sumrow" style="margin:0;padding:10px 0;border-bottom:1px solid #f0f0f0"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="desc" style="margin-bottom:14px">첨부된 이마트 레시피 화면을 참고한 발표용 상세 화면입니다. 실제 공식 사이트에 접속한 화면은 아닙니다.</div><button class="btn block" onclick="choose('oyster')">이 재료로 장보기 이어가기 →</button><button class="btn block secondary" style="margin-top:10px" onclick="ext()">이마트 공식 레시피북 전체보기 ↗</button></section></main>`} 

function recipeAdditional(id){
  const m=menus.find(x=>x.id===id);
  const isCutlet=id==='cutlet';
  const heading=isCutlet?'칼칼하게 맛있는 돈가스 김치전골':'속이 확 풀리는 얼큰 계란탕';
  const narrative=isCutlet?'바삭하고 고소한 돈가스를 칼칼하고 감칠맛 좋은 묵은지와 함께 끓여보세요. 냉동 돈가스를 활용하면 간편하게 만들 수 있고, 취향에 따라 달걀을 더해 한층 부드럽고 든든하게 즐길 수 있어요. 따뜻한 국물이 생각나는 저녁, 보글보글 냄비째 끓여 가며 밥과 함께 드셔보세요.':'기름진 명절 음식으로 지친 속을 달래줄 국물 요리, 얼큰 계란탕을 소개합니다. 몽글몽글한 계란에 볶은 고춧가루를 더해 칼칼하고 개운한 국물을 맛볼 수 있어요. 무엇보다 재료 준비도 만들기도 간편해 먹기 좋습니다. 당면도 넣어 호로록~ 더 맛있고 든든하게 드셔보세요.';
  return `${head('레시피북',S.recipeBack||'menus')}<main class="page"><div class="cover" style="height:340px"><img src="${m.photo}" alt="${m.name} 음식 사진" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback">${m.name}</div></div><section class="inner" style="padding-top:26px"><h1 style="font-size:31px;letter-spacing:-1.1px;line-height:1.28;margin:0 0 16px;font-weight:900">${heading}</h1><p style="color:#555;font-size:16px;line-height:1.8;margin:0 0 26px">${narrative}</p><div class="receiptbox" style="padding:0;overflow:hidden"><div style="display:grid;grid-template-columns:1fr 1fr"><div style="padding:18px 14px;text-align:center;border-right:1px solid #eee"><div class="muted" style="font-size:12px">소요시간</div><div style="font-weight:900;font-size:26px;margin-top:8px">${m.time}분</div></div><div style="padding:18px 14px;text-align:center"><div class="muted" style="font-size:12px">분량</div><div style="font-weight:900;font-size:26px;margin-top:8px">${m.servings}인분</div></div></div></div><div class="subhead">재료 <span class="tag">시연용 예시</span></div><div class="receiptbox">${m.items.map(i=>`<div class="sumrow" style="margin:0;padding:10px 0;border-bottom:1px solid #f0f0f0"><span>${i.name}</span><strong>${i.qty}</strong></div>`).join('')}</div><p class="desc" style="margin:10px 0 18px">이 화면은 사용자가 제공한 공식 레시피 스크린샷을 참고한 시연용 상세 화면입니다. 재료 목록은 데모용이며 실제 공식 페이지와 다를 수 있습니다.</p><button class="btn block" onclick="choose('${id}')">이 재료로 장보기 이어가기 →</button><button class="btn block secondary" style="margin-top:10px" onclick="ext()">이마트 공식 레시피북 전체보기 ↗</button></section></main>`
}
function simple(p){return `${head(p==='coupons'?'쿠폰':'마이','home')}<main class="page"><section class="inner"><h2 class="section-title">${p==='coupons'?'쿠폰 안내':'마이페이지'}</h2><div class="nudge">본 페이지는 프로젝트 발표용 프로토타입입니다. 실제 이마트 계정·쿠폰과 연결되지 않습니다.</div><button class="btn block" style="margin-top:25px" onclick="navto('menus')">e식탁으로 이동</button></section></main>`}
function admin(){return `${head('e식탁 운영 데모','home')}<main class="page"><section class="inner"><span class="screen-tag">신세계I&C 운영 시나리오 · 합성 데이터</span><h1 style="font-size:25px;letter-spacing:-1px">매장 메뉴 큐레이션<br>운영 현황</h1><p class="desc">아래 수치는 기능 설명을 위한 가상 예시입니다.</p><div class="admincards"><div class="admincard">메뉴판 관심 행동<b>1,248</b><small>가상 집계</small></div><div class="admincard">메뉴 관련 구매<b>306</b><small>가상 구매 건수</small></div><div class="admincard">자동 할인 건수<b>97</b><small>가상 적용 건수</small></div><div class="admincard">차회 쿠폰 사용<b>24</b><small>가상 사용 건수</small></div></div><h3 class="subhead">추천 메뉴별 구매 건수</h3>${[['얼큰 뜨끈 든든한 굴 당면',148],['돈가스 김치전골',92],['얼큰 계란탕',66]].map(([n,v])=>`<div class="sumrow"><span>${n}</span><b>${v}건</b></div><div class="bar"><span style="width:${v/148*100}%"></span></div>`).join('')}<div class="notice" style="margin-top:28px">Vision AI는 향후 구역별 방문·체류 통계를 활용하는 제안입니다. 실제 영상 처리, 개인 식별 또는 POS·영상의 개인별 결합은 수행하지 않습니다.</div><button class="btn block secondary" style="margin-top:25px" onclick="navto('home')">고객 화면으로 돌아가기</button></section></main>`}
function render(){let html=S.page==='home'?home():S.page==='menus'?menuHome():S.page==='menu'||S.page==='list'?menuDetail():S.page==='sco'?sco():S.page==='receipt'?receipt():S.page==='recipe_oyster'?recipeOyster():S.page==='recipe_cutlet'?recipeAdditional('cutlet'):S.page==='recipe_egg'?recipeAdditional('egg'):S.page==='admin'?admin():simple(S.page);document.getElementById('app').innerHTML=html+(S.page==='admin'?'':nav());}render();
</script></body></html>
